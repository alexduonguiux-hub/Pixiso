# Hand-written labels for everything the sprite-kit registry defines.
# Ids must match packages/sprite-kit exactly; build-catalog fails on any
# missing or extra entry. Values are Vietnamese UI strings and search tags.

source:
  id: pixiso_base
  name: Bộ nhân vật cơ bản Pixiso (vẽ trực tiếp trên lưới pixel trong repo này)
  license: Pixiso (chủ dự án quyết định giấy phép phân phối)
  note: Không dùng asset bên ngoài. Mọi template nằm trong packages/sprite-kit.

referenceCharacter: human

characters:
  human:
    label_vi: Người (chibi 32 px)
    description_vi: Thân 32 px kiểu chibi, đầu 14 px, mắt 2×2
    tags: [người, chibi, cơ bản, nhân vật]
  hero:
    label_vi: Người (64 px, vẽ tay)
    description_vi: Thân 64 px vẽ tay năm góc, đi bộ tám hướng; dàn nhân vật Vùng Xanh mặc trên thân này
    tags: [người, '64 px', vẽ tay, vùng xanh, nhân vật]
  rats:
    label_vi: Bầy chuột (64 px)
    description_vi: Ba con chuột trên cùng ô 64 px và điểm neo của người; không có bộ phận, chỉ đổi màu lông, da và mắt
    tags: [chuột, bầy, thú, '64 px', vùng xanh]
  droop:
    label_vi: Zombie gục đầu
    description_vi: Thân người 64 px, đầu gục nghiêng, tay buông; chỉ có khung đứng
    tags: [zombie, dáng, gục đầu, '64 px']
  droop_m:
    label_vi: Zombie gục đầu (lật)
    description_vi: Dáng gục đầu nghiêng sang bên kia; chỉ có khung đứng
    tags: [zombie, dáng, gục đầu, lật, '64 px']
  twist:
    label_vi: Zombie ngoẹo cổ
    description_vi: Thân người 64 px, cổ ngoẹo sang một bên; chỉ có khung đứng
    tags: [zombie, dáng, ngoẹo cổ, '64 px']
  twist_m:
    label_vi: Zombie ngoẹo cổ (lật)
    description_vi: Dáng ngoẹo cổ sang bên kia; chỉ có khung đứng
    tags: [zombie, dáng, ngoẹo cổ, lật, '64 px']
  reach:
    label_vi: Zombie vươn tay
    description_vi: Thân người 64 px, hai tay vươn về phía trước; chỉ có khung đứng
    tags: [zombie, dáng, vươn tay, '64 px']
  drag:
    label_vi: Zombie lết chân
    description_vi: Thân người 64 px, một chân lết sau; chỉ có khung đứng
    tags: [zombie, dáng, lết chân, '64 px']
  drag_m:
    label_vi: Zombie lết chân (lật)
    description_vi: Dáng lết chân bên kia; chỉ có khung đứng
    tags: [zombie, dáng, lết chân, lật, '64 px']
  hunch:
    label_vi: Zombie gù lưng
    description_vi: Thân người 64 px, lưng gù có bướu, đầu thụt; chỉ có khung đứng
    tags: [zombie, dáng, gù, bướu, '64 px']
  crawl:
    label_vi: Dáng bò
    description_vi: Thân người 64 px ngồi xổm bò bằng bốn chi (Kẻ Bám Trần); chỉ có khung đứng
    tags: [zombie, dáng, bò, trần, '64 px']
  heavy:
    label_vi: Người to con (64 px)
    description_vi: Thân to con 23×45 ô, vai rộng, tay dày (Hùng, Kẻ Mang Vỏ); chỉ có khung đứng
    tags: [người, to con, cơ bắp, '64 px']
  fat:
    label_vi: Người mập (64 px)
    description_vi: Thân mập bụng phình, đầu bè (Kẻ Phun); chỉ có khung đứng
    tags: [người, mập, bụng, '64 px']
  brute:
    label_vi: Khổng lồ đột biến (64 px)
    description_vi: Thân khổng lồ 31 cột với đầu riêng, không đội mũ hay tóc thường được (Đột Biến); chỉ có khung đứng
    tags: [khổng lồ, đột biến, quái, '64 px']

