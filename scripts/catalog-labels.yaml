# Meshes already inside a character GLB, exposed as character-specific parts.
# Every other non-skinned mesh in the GLB (built-in weapons/shields) stays hidden;
# the file parts above cover the same items for all characters.
builtinParts:
  knight_helmet:
    character: knight
    node: Knight_Helmet
    slot: head
    label_vi: Mũ giáp hiệp sĩ
    tags: [mũ, mũ giáp, giáp]
  knight_cape:
    character: knight
    node: Knight_Cape
    slot: back
    label_vi: Áo choàng hiệp sĩ
    tags: [áo choàng]
  barbarian_hat:
    character: barbarian
    node: Barbarian_Hat
    slot: head
    label_vi: Mũ sừng
    tags: [mũ, sừng, man rợ]
  barbarian_cape:
    character: barbarian
    node: Barbarian_Cape
    slot: back
    label_vi: Áo choàng man rợ
    tags: [áo choàng]
  mage_hat:
    character: mage
    node: Mage_Hat
    slot: head
    label_vi: Mũ pháp sư
    tags: [mũ, mũ nhọn, pháp sư]
  mage_cape:
    character: mage
    node: Mage_Cape
    slot: back
    label_vi: Áo choàng pháp sư
    tags: [áo choàng]
  rogue_cape:
    character: rogue
    node: Rogue_Cape
    slot: back
    label_vi: Áo choàng kẻ trộm
    tags: [áo choàng]
  rogue_hooded_cape:
    character: rogue_hooded
    node: Rogue_Cape
    slot: back
    label_vi: Áo choàng kẻ trộm
    tags: [áo choàng]

# Recolour targets. kind=mesh matches character mesh nodes by suffix
# (e.g. Knight_Body); kind=slot recolours whatever part sits in that slot.
colorTargets:
  body: { label_vi: Thân / áo, meshSuffixes: [_Body] }
  head: { label_vi: Đầu, meshSuffixes: [_Head, _Head_Hooded] }
  arms: { label_vi: Tay, meshSuffixes: [_ArmLeft, _ArmRight] }
  legs: { label_vi: Chân / quần, meshSuffixes: [_LegLeft, _LegRight] }
  headwear: { label_vi: Mũ, slot: head }
  back: { label_vi: Áo choàng, slot: back }
  hand_right: { label_vi: Vật tay phải, slot: hand_right }
  hand_left: { label_vi: Vật tay trái, slot: hand_left }

