# Hand-written labels and curation for the catalog.
# Node names, file ids and clip names must match what `pnpm assets:inspect`
# found (see docs/ASSET_REPORT.md); build-catalog.ts fails loudly otherwise.
# Vietnamese labels are user-facing; ids are stable English snake_case.

referenceCharacter: knight

characters:
  knight:
    label_vi: Hiệp sĩ
    description_vi: Giáp nặng, hợp với kiếm và khiên
    tags: [giáp, cận chiến, kiếm, khiên, lính, chiến binh, bảo vệ]
  barbarian:
    label_vi: Chiến binh man rợ
    description_vi: Cơ bắp, hợp với rìu
    tags: [rìu, cơ bắp, cận chiến, hoang dã, mạnh mẽ, man rợ]
  mage:
    label_vi: Pháp sư
    description_vi: Áo choàng và mũ nhọn, hợp với gậy phép
    tags: [phép thuật, gậy phép, áo choàng, mũ nhọn, phù thủy, thầy phù thủy]
  rogue:
    label_vi: Kẻ trộm
    description_vi: Nhẹ nhàng, hợp với dao găm và nỏ
    tags: [dao găm, nỏ, lén lút, nhanh nhẹn, sát thủ, cung thủ, trộm]
  rogue_hooded:
    label_vi: Kẻ trộm trùm đầu
    description_vi: Như Kẻ trộm nhưng có mũ trùm
    tags: [dao găm, nỏ, lén lút, trùm đầu, bí ẩn, sát thủ, cung thủ]

slots:
  hand_right: { label_vi: Tay phải, bone: handslot.r }
  hand_left: { label_vi: Tay trái, bone: handslot.l }
  head: { label_vi: Đầu, bone: head }
  back: { label_vi: Lưng, bone: chest }

# Default local transforms for file parts, copied from the equivalent built-in
# meshes inside the GLBs (Knight `1H_Sword` under handslot.r, `1H_Sword_Offhand`
# under handslot.l). Rotation is a quaternion [x, y, z, w].
attachDefaults:
  hand_right: { translation: [0, 0.033, 0], rotation: [0, -1, 0, 0] }
  hand_left: { translation: [0, 0.017, 0], rotation: [0, 0, 0, 1] }

# Shared attach presets referenced below.
attachPresets:
  shield_left: { translation: [0, 0.017, 0.156], rotation: [0, 0, 0, 1] }
  grip_right: { translation: [0, 0, 0], rotation: [0, -1, 0, 0] }
  grip_left: { translation: [0, 0, 0], rotation: [0, 0, 0, 1] }
  crossbow_right: { translation: [-0.105, -0.010, 0], rotation: [0, 0.707, 0, 0.707] }
  mug_right: { translation: [0.301, -0.016, 0], rotation: [0, -1, 0, 0] }
  throwable_right: { translation: [0, 0.180, 0], rotation: [0, -1, 0, 0] }
  spellbook_closed_left: { translation: [0, 0.266, 0], rotation: [0, -0.707, -0.707, 0] }
  spellbook_open_left: { translation: [0, 0.145, 0], rotation: [0, -0.707, -0.707, 0] }

# External accessory files (Assets/gltf/<id>.gltf). Files not listed here are
