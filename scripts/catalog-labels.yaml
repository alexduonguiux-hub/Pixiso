# Hand-written labels for everything the sprite-kit registry defines.
# Ids must match packages/sprite-kit exactly; build-catalog fails on any
# missing or extra entry. Values are Vietnamese UI strings and search tags.

source:
  id: pixiso_base
  name: Bộ nhân vật cơ bản Pixiso (vẽ trực tiếp trên lưới pixel trong repo này)
  license: Pixiso (chủ dự án quyết định giấy phép phân phối)
  note: Không dùng asset bên ngoài. Mọi template nằm trong packages/sprite-kit.

referenceCharacter: human

characters:
  human:
    label_vi: Người (chibi 32 px)
    description_vi: Thân 32 px kiểu chibi, đầu 14 px, mắt 2×2
    tags: [người, chibi, cơ bản, nhân vật]

slots:
  head: { label_vi: Đầu }
  hand_right: { label_vi: Tay phải }
  hand_left: { label_vi: Tay trái }
  back: { label_vi: Lưng }

parts:
  knight_helmet: { label_vi: Mũ giáp hiệp sĩ, tags: [mũ, giáp, hiệp sĩ, kim loại, bảo vệ] }
  sword_1handed: { label_vi: Kiếm một tay, tags: [kiếm, cận chiến, vũ khí, chém] }
  shield_round: { label_vi: Khiên tròn, tags: [khiên, phòng thủ, gỗ, bảo vệ] }
  cape: { label_vi: Áo choàng, tags: [áo choàng, lưng, vải, hiệp sĩ] }

colorTargets:
  skin: { label_vi: Da }
  hair: { label_vi: Tóc }
  body: { label_vi: Áo / thân }
  legs: { label_vi: Quần }
  boots: { label_vi: Giày }
  cape: { label_vi: Áo choàng }
  metal: { label_vi: Kim loại }
  leather: { label_vi: Da thuộc }
  wood: { label_vi: Gỗ }
  accent: { label_vi: Điểm nhấn }

colors:
  original: { label_vi: Màu gốc, hex: '#888888' }
  red: { label_vi: Đỏ, hex: '#d1343a' }
  dark_red: { label_vi: Đỏ sẫm, hex: '#7d1a22' }
  orange: { label_vi: Cam, hex: '#e8742a' }
  yellow: { label_vi: Vàng, hex: '#f2d23c' }
  gold: { label_vi: Vàng kim, hex: '#d9a21b' }
  green: { label_vi: Xanh lá, hex: '#4caf50' }
  forest_green: { label_vi: Xanh rừng, hex: '#2e6b3a' }
  teal: { label_vi: Xanh ngọc, hex: '#2a9d8f' }
  blue: { label_vi: Xanh dương, hex: '#3a7bd5' }
  navy: { label_vi: Xanh đậm, hex: '#243a6b' }
  purple: { label_vi: Tím, hex: '#7e4bbf' }
  pink: { label_vi: Hồng, hex: '#e87aa8' }
  brown: { label_vi: Nâu, hex: '#7a4a2a' }
  white: { label_vi: Trắng, hex: '#ececec' }
  gray: { label_vi: Xám, hex: '#8a8a92' }
  black: { label_vi: Đen, hex: '#1e1e24' }

animations:
  idle: { label_vi: Đứng yên, tags: [đứng, nghỉ, chờ] }
  walk: { label_vi: Đi bộ, tags: [đi, di chuyển, bước] }
