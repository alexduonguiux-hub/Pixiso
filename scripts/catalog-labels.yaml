# Ready-made characters on the hero body (sprite-kit BASE_LOOKS, D-096).
presets:
  duong:
    label_vi: Dương
    description_vi: Thủ lĩnh nhóm sống sót, tóc dựng, áo thun xanh lá
    tags: [vùng xanh, thủ lĩnh, người chơi, dương]
  ny:
    label_vi: Ny
    description_vi: Y tá của nhóm, tóc xoăn đỏ, áo y tá bạc hà với túi cứu thương
    tags: [vùng xanh, y tá, người chơi, ny]
  son:
    label_vi: Sơn
    description_vi: Kỹ thuật viên, kính tròn, áo khoác khoá kéo, ba lô và gậy
    tags: [vùng xanh, kỹ thuật, người chơi, sơn]
  ong_tu:
    label_vi: Ông Tư
    description_vi: Kiểm lâm già, mũ vành, râu bạc, áo khoác dài vàng đất
    tags: [vùng xanh, kiểm lâm, già, ông tư]
  bac_si_lan:
    label_vi: Bác sĩ Lan
    description_vi: Bác sĩ, tóc bob nâu đỏ, kính tròn, áo blouse trắng với bìa kẹp
    tags: [vùng xanh, bác sĩ, lan]
  ke_bat_chuoc:
    label_vi: Kẻ Bắt Chước
    description_vi: Kẻ giả dạng người, tóc rối dài, váy liền dính máu, mắt đỏ và nụ cười quá rộng
    tags: [vùng xanh, quái, ma, kẻ bắt chước]
  linh_non_sat:
    label_vi: Lính nón sắt
    description_vi: Lính bộ binh, nón sắt, quân phục rằn ri, súng đeo lưng
    tags: [vùng xanh, lính, quân đội, nón sắt]
  linh_mu_noi:
    label_vi: Lính mũ nồi
    description_vi: Sĩ quan, mũ nồi đỏ rượu, quân phục có phù hiệu, túi bản đồ
    tags: [vùng xanh, lính, sĩ quan, mũ nồi]
  linh_dau_dinh:
    label_vi: Lính đầu đinh
    description_vi: Lính ngoài giờ, đầu đinh, áo thun lính với thẻ bài, súng cầm tay
    tags: [vùng xanh, lính, đầu đinh]
  linh_nu:
    label_vi: Lính nữ
    description_vi: Nữ quân nhân, mũ lưỡi trai trên tóc đuôi ngựa, quân phục rằn ri
    tags: [vùng xanh, lính, nữ]
  linh_quan_y:
    label_vi: Lính quân y
    description_vi: Quân y, nón sắt có chữ thập đỏ, băng tay trắng, túi cứu thương lớn
    tags: [vùng xanh, lính, quân y, cứu thương]
  ke_lang_thang:
    label_vi: Kẻ Lang Thang
    description_vi: Kẻ nhiễm canh đầu cầu, đầu trọc da tái, áo ba lỗ nâu rách, chân trần
    tags: [vùng xanh, quái, zombie, canh gác, kẻ lang thang]
  mai:
    label_vi: Mai
    description_vi: Hồn ma dẫn đường, cô gái tóc ngắn, toàn thân xanh lục nhạt, chân trần
    tags: [vùng xanh, hồn ma, npc, mai]
