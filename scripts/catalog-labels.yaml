# Hand-written labels for everything the sprite-kit registry defines.
# Ids must match packages/sprite-kit exactly; build-catalog fails on any
# missing or extra entry. Values are Vietnamese UI strings and search tags.

source:
  id: pixiso_base
  name: Bộ nhân vật cơ bản Pixiso (vẽ trực tiếp trên lưới pixel trong repo này)
  license: Pixiso (chủ dự án quyết định giấy phép phân phối)
  note: Không dùng asset bên ngoài. Mọi template nằm trong packages/sprite-kit.

referenceCharacter: human

characters:
  human:
    label_vi: Người (chibi 32 px)
    description_vi: Thân 32 px kiểu chibi, đầu 14 px, mắt 2×2
    tags: [người, chibi, cơ bản, nhân vật]
  hero:
    label_vi: Người (64 px, vẽ tay)
    description_vi: Thân 64 px vẽ tay năm góc, đi bộ tám hướng; dàn nhân vật Vùng Xanh mặc trên thân này
    tags: [người, '64 px', vẽ tay, vùng xanh, nhân vật]

